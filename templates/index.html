<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>沈董投資系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f8; color: #1a202c; font-size: 14px;
        }

        /* 表頭 */
        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
            color: #fff; padding: 14px 24px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,.25);
        }
        .header h1 { font-size: 1.3rem; font-weight: 700; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .stats { color: rgba(255,255,255,.8); font-size: 12px; }

        .btn {
            padding: 6px 14px; border: 1px solid rgba(255,255,255,.4);
            background: rgba(255,255,255,.15); color: #fff; border-radius: 6px;
            cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,.25); }

        /* 工具列 */
        .toolbar {
            padding: 8px 24px; display: flex; align-items: center; gap: 10px;
            background: #fff; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap;
        }
        .search-input {
            padding: 5px 10px; background: #fff; border: 1px solid #cbd5e1;
            color: #1a202c; border-radius: 6px; font-size: 13px; width: 180px; outline: none;
        }
        .search-input:focus { border-color: #2563eb; }
        .search-input::placeholder { color: #94a3b8; }
        .filter-info { color: #64748b; font-size: 12px; }

        /* 篩選按鈕共用 */
        .pill {
            padding: 4px 12px; border: 2px solid; border-radius: 20px;
            cursor: pointer; font-size: 12px; font-weight: 700; background: #fff;
            transition: all .15s; white-space: nowrap;
        }
        .pill:hover { opacity: .85; }
        .pill.active { color: #fff !important; }

        /* 清單顏色 */
        .pill-watch  { border-color: #7c3aed; color: #7c3aed; }
        .pill-watch.active  { background: #7c3aed; }
        .pill-hold   { border-color: #dc2626; color: #dc2626; }
        .pill-hold.active   { background: #dc2626; }
        .pill-focus  { border-color: #d97706; color: #d97706; }
        .pill-focus.active  { background: #d97706; }
        .pill-skip   { border-color: #6b7280; color: #6b7280; }
        .pill-skip.active   { background: #6b7280; }

        /* 欄位收合按鈕 */
        .col-toggle {
            padding: 3px 10px; border: 1px solid #94a3b8; border-radius: 14px;
            cursor: pointer; font-size: 11px; font-weight: 600; background: #fff;
            color: #64748b; transition: all .15s;
        }
        .col-toggle.hidden { background: #e2e8f0; color: #94a3b8; text-decoration: line-through; }

        /* 下拉選單 */
        select.filter-select {
            padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 6px;
            font-size: 12px; outline: none; background: #fff; color: #334155;
        }

        /* 分頁 */
        .page-info { font-size: 12px; color: #64748b; }
        .page-btn {
            padding: 3px 10px; border: 1px solid #cbd5e1; border-radius: 4px;
            background: #fff; cursor: pointer; font-size: 12px; color: #334155;
        }
        .page-btn:disabled { opacity: .4; cursor: not-allowed; }
        .page-btn.active-page { background: #2563eb; color: #fff; border-color: #2563eb; }

        /* 表格 */
        .table-wrapper { overflow: auto; height: calc(100vh - 145px); }
        table { border-collapse: separate; border-spacing: 0; width: max-content; background: #fff; }

        thead th {
            position: sticky; top: 0; z-index: 10;
            background: #1e3a5f; color: #fff; padding: 6px 10px;
            text-align: center; font-weight: 600; white-space: nowrap;
        }
        thead tr.sub-header th { border-bottom: 2px solid #2563eb; }

        tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.1s; }
        tbody tr:hover { background: #f8fafc; }
        tbody tr:nth-child(even) { background: #f8fafc; }
        tbody tr:nth-child(even):hover { background: #f1f5f9; }
        tbody td {
            padding: 5px 10px; text-align: right; white-space: nowrap;
            border-bottom: 1px solid #f1f5f9;
        }

        /* 凍結欄 */
        td.frozen-1, th.frozen-1 { position: sticky; left: 0; z-index: 5; }
        td.frozen-2, th.frozen-2 { position: sticky; left: 55px; z-index: 5; }
        th.frozen-1, th.frozen-2 { z-index: 20; background: #1e3a5f !important; }
        td.frozen-1 { text-align: left; font-weight: 700; color: #2563eb; }
        td.frozen-2 { text-align: left; color: #334155; }
        tbody tr:nth-child(odd) td.frozen-1, tbody tr:nth-child(odd) td.frozen-2 { background: #fff; }
        tbody tr:nth-child(even) td.frozen-1, tbody tr:nth-child(even) td.frozen-2 { background: #f8fafc; }
        tbody tr:hover td.frozen-1, tbody tr:hover td.frozen-2 { background: #f1f5f9; }

        td.num { font-variant-numeric: tabular-nums; font-family: "SF Mono","Menlo","Consolas",monospace; }
        td.positive { color: #dc2626; }
        td.negative { color: #16a34a; }
        td.price-val { font-weight: 700; color: #1e3a5f; }
        .rt-badge { display:inline-block; padding:1px 6px; border-radius:3px; background:#059669; color:#fff; font-size:10px; margin-left:6px; }

        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { color: #fbbf24; }
        .sort-arrow { font-size: 10px; color: rgba(255,255,255,.5); }
        .sort-arrow.asc, .sort-arrow.desc { color: #fbbf24; }

        .sep-left { border-left: 2px solid #e2e8f0; }
        .year-sep { border-left: 2px dashed #cbd5e1; }
        td.na { color: #94a3b8; text-align: center; }

        .loading { text-align: center; padding: 80px; color: #94a3b8; font-size: 16px; }
        .unit-hint { font-size: 10px; color: rgba(255,255,255,.6); font-weight: 400; }

        /* 欄位群組隱藏 */
        body.hide-g-lastrev .g-lastrev,
        body.hide-g-rev .g-rev,
        body.hide-g-gm .g-gm,
        body.hide-g-qrev .g-qrev,
        body.hide-g-qoq .g-qoq,
        body.hide-g-histeps .g-histeps,
        body.hide-g-qeps .g-qeps,
        body.hide-g-price .g-price,
        body.hide-g-div .g-div,
        body.hide-g-shen .g-shen,
        body.hide-g-est .g-est,
        body.hide-g-note .g-note { display: none; }

        /* 清單欄 checkbox */
        .list-cb { cursor: pointer; width: 16px; height: 16px; accent-color: #2563eb; }

        /* 彈出面板 */
        .panel-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,.3); z-index: 999; display: none;
        }
        .panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.2);
            padding: 24px; z-index: 1000; min-width: 380px; max-height: 80vh; overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>沈董投資系統</h1></div>
        <div class="header-right">
            <span class="stats" id="stats"></span>
            <label style="font-size:12px;color:#64748b;display:flex;align-items:center;gap:4px;white-space:nowrap">縮放
                <input type="range" id="zoomSlider" min="50" max="150" value="100" step="5" style="width:70px;cursor:pointer" oninput="applyZoom(this.value)">
                <span id="zoomVal" style="min-width:30px;color:rgba(255,255,255,.9)">100%</span>
            </label>
        </div>
    </div>

    <!-- 工具列第一行：搜尋 + 清單篩選 + 產業篩選 -->
    <div class="toolbar" id="toolbar1">
        <input type="text" class="search-input" id="search" placeholder="搜尋代碼或名稱..." oninput="applyFilter()">

        <span style="font-size:12px;font-weight:700;color:#64748b">清單</span>
        <button class="pill pill-watch" id="btn-f-watch" onclick="toggleListFilter('watch')">觀察 <span id="cnt-watch"></span></button>
        <button class="pill pill-hold" id="btn-f-hold" onclick="toggleListFilter('hold')">持股 <span id="cnt-hold"></span></button>
        <button class="pill pill-focus" id="btn-f-focus" onclick="toggleListFilter('focus')">重點 <span id="cnt-focus"></span></button>
        <button class="pill pill-skip" id="btn-f-skip" onclick="toggleListFilter('skip')">略過 <span id="cnt-skip"></span></button>

        <select class="filter-select" id="industryFilter" onchange="applyFilter()">
            <option value="">全部產業</option>
        </select>

        <span class="filter-info" id="filter-info"></span>

        <button class="pill" style="border-color:#059669;color:#059669;margin-left:auto" onclick="exportCSV()">匯出 CSV</button>
    </div>

    <!-- 工具列第二行：欄位收合 + 分頁 -->
    <div class="toolbar" id="toolbar2">
        <span style="font-size:12px;font-weight:700;color:#64748b">欄位</span>
        <button class="col-toggle" data-group="lastrev" onclick="toggleColGroup('lastrev',this)">去年營收</button>
        <button class="col-toggle" data-group="rev" onclick="toggleColGroup('rev',this)">今年營收</button>
        <button class="col-toggle" data-group="gm" onclick="toggleColGroup('gm',this)">季毛利率</button>
        <button class="col-toggle" data-group="qrev" onclick="toggleColGroup('qrev',this)">季營收</button>
        <button class="col-toggle" data-group="qoq" onclick="toggleColGroup('qoq',this)">季變動</button>
        <button class="col-toggle" data-group="histeps" onclick="toggleColGroup('histeps',this)">歷史EPS</button>
        <button class="col-toggle" data-group="qeps" onclick="toggleColGroup('qeps',this)">季EPS</button>
        <button class="col-toggle" data-group="price" onclick="toggleColGroup('price',this)">股價</button>
        <button class="col-toggle" data-group="div" onclick="toggleColGroup('div',this)">股利</button>
        <button class="col-toggle" data-group="shen" onclick="toggleColGroup('shen',this)">沈董</button>
        <button class="col-toggle" data-group="est" onclick="toggleColGroup('est',this)">預估</button>
        <button class="col-toggle" data-group="note" onclick="toggleColGroup('note',this)">備註</button>

        <span style="flex:1"></span>
        <span style="font-size:12px;font-weight:700;color:#64748b">每頁</span>
        <select class="filter-select" id="pageSizeSelect" onchange="changePageSize()">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="0">全部</option>
        </select>
        <button class="page-btn" id="prevPage" onclick="changePage(-1)">&lt;</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="page-btn" id="nextPage" onclick="changePage(1)">&gt;</button>
    </div>

    <div class="table-wrapper">
        <div class="loading" id="loading">載入中...</div>
        <table id="main-table" style="display:none;">
            <thead><tr class="sub-header" id="sub-header"></tr></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script>
    // ── 全域狀態 ──
    let allStocks = [];
    let filteredStocks = [];
    const _today = new Date().toISOString().slice(0, 10);

    // 清單
    const LIST_TYPES = ['watch','hold','focus','skip'];
    let _lists = { watch: new Set(), hold: new Set(), focus: new Set(), skip: new Set() };
    let _listFilter = null; // null=不篩選, 'watch'/'hold'/'focus'/'skip'
    let _allEstimates = {};

    // 分頁
    let _pageSize = 100;
    let _currentPage = 1;

    // 排序
    let _sortKey = null, _sortAsc = true;
    let _renderParams = {};

    // 欄位群組顯示狀態
    let _hiddenGroups = {};

    // ── 初始化 ──
    async function init() {
        loadLocalSettings();
        const [stockResp, statResp, listResp, estResp] = await Promise.all([
            fetch('/api/stocks'), fetch('/api/stats'), fetch('/api/lists'), fetch('/api/estimates')
        ]);
        const data = await stockResp.json();
        const stats = await statResp.json();
        const lists = await listResp.json();
        _allEstimates = await estResp.json();

        document.getElementById('stats').textContent =
            `${stats.stocks} 支 | 月營收 ${stats.monthly_revenue_records} 筆 | 季報 ${stats.quarterly_records} 筆` +
            (stats.latest_month ? ` | 最新 ${stats.latest_month}` : '');

        // 清單
        LIST_TYPES.forEach(t => { _lists[t] = new Set(lists[t] || []); });
        updateListCounts();

        // 產業篩選
        if (data.industries) {
            const sel = document.getElementById('industryFilter');
            data.industries.forEach(ind => {
                const opt = document.createElement('option');
                opt.value = ind; opt.textContent = ind;
                sel.appendChild(opt);
            });
        }

        renderTable(data);
        applyFilter();

        // 即時報價
        fetchRealtimePrices();
        setInterval(fetchRealtimePrices, 60000);
    }

    function loadLocalSettings() {
        const ps = localStorage.getItem('sd_pageSize');
        if (ps) { _pageSize = parseInt(ps); document.getElementById('pageSizeSelect').value = ps; }
        const hg = localStorage.getItem('sd_hiddenGroups');
        if (hg) {
            try { _hiddenGroups = JSON.parse(hg); } catch(e) {}
            Object.keys(_hiddenGroups).forEach(g => {
                if (_hiddenGroups[g]) {
                    document.body.classList.add('hide-g-' + g);
                    const btn = document.querySelector(`.col-toggle[data-group="${g}"]`);
                    if (btn) btn.classList.add('hidden');
                }
            });
        }
        const z = localStorage.getItem('sd_zoom');
        if (z) { document.getElementById('zoomSlider').value = z; applyZoom(z); }
    }

    // ── 欄位收合 ──
    function toggleColGroup(group, btn) {
        const cls = 'hide-g-' + group;
        const isHidden = document.body.classList.toggle(cls);
        btn.classList.toggle('hidden', isHidden);
        _hiddenGroups[group] = isHidden;
        localStorage.setItem('sd_hiddenGroups', JSON.stringify(_hiddenGroups));
    }

    // ── 分頁 ──
    function changePageSize() {
        _pageSize = parseInt(document.getElementById('pageSizeSelect').value);
        localStorage.setItem('sd_pageSize', _pageSize);
        _currentPage = 1;
        renderPage();
    }
    function changePage(delta) {
        _currentPage += delta;
        renderPage();
    }
    function renderPage() {
        const total = filteredStocks.length;
        const size = _pageSize || total;
        const maxPage = Math.max(1, Math.ceil(total / size));
        _currentPage = Math.max(1, Math.min(_currentPage, maxPage));
        const start = ((_currentPage - 1) * size);
        const pageStocks = _pageSize > 0 ? filteredStocks.slice(start, start + size) : filteredStocks;

        const p = _renderParams;
        renderRows(pageStocks, p.months, p.quarterly_cols, p.last_year_q, p.current_year_q, p.months_last, p.year_3ago, p.currentYear, p.lastYear);

        document.getElementById('pageInfo').textContent = _pageSize > 0
            ? `${_currentPage}/${maxPage} (${total})`
            : `全部 ${total}`;
        document.getElementById('prevPage').disabled = (_currentPage <= 1);
        document.getElementById('nextPage').disabled = (_currentPage >= maxPage || !_pageSize);
    }

    // ── 清單 ──
    function updateListCounts() {
        LIST_TYPES.forEach(t => {
            const el = document.getElementById('cnt-' + t);
            if (el) el.textContent = _lists[t].size ? _lists[t].size : '';
        });
    }
    function toggleListFilter(type) {
        _listFilter = (_listFilter === type) ? null : type;
        LIST_TYPES.forEach(t => {
            document.getElementById('btn-f-' + t).classList.toggle('active', _listFilter === t);
        });
        _currentPage = 1;
        applyFilter();
    }
    function saveList(type) {
        fetch('/api/lists/' + type, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({codes: [..._lists[type]]})
        });
        updateListCounts();
    }
    function toggleListItem(type, code) {
        if (_lists[type].has(code)) _lists[type].delete(code);
        else _lists[type].add(code);
        saveList(type);
        // 如果正在篩選此清單，重新篩選
        if (_listFilter === type) applyFilter();
    }

    // ── 篩選 ──
    function applyFilter() {
        const keyword = document.getElementById('search').value.trim().toLowerCase();
        const industry = document.getElementById('industryFilter').value;

        filteredStocks = allStocks.filter(s => {
            if (keyword && !s.code.toLowerCase().includes(keyword) && !s.name.toLowerCase().includes(keyword)) return false;
            if (industry && s.industry !== industry) return false;
            if (_listFilter && !_lists[_listFilter].has(s.code)) return false;
            return true;
        });

        _currentPage = 1;
        renderPage();

        let info = '';
        if (_listFilter) {
            const labels = {watch:'觀察',hold:'持股',focus:'重點',skip:'略過'};
            info = labels[_listFilter] + '：';
        }
        info += `${filteredStocks.length} / ${allStocks.length} 支`;
        document.getElementById('filter-info').textContent = info;
    }

    // ── 格式化 ──
    const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    function fmtRevM(val) { return val == null ? '-' : Math.round(val / 1000).toLocaleString('zh-TW'); }
    function fmtQRevM(val) { return val == null ? '-' : Math.round(val / 1000000).toLocaleString('zh-TW'); }
    function fmtEps(val) { return val == null ? '-' : val.toFixed(2); }
    function fmtChange(val) { return val == null ? '-' : (val > 0 ? '+' : '') + val.toFixed(2) + '%'; }
    function fmtPct(val) { return val == null ? '-' : val.toFixed(2) + '%'; }

    // ── 渲染表格 ──
    function renderTable(data) {
        const { stocks, months, quarterly_cols, last_year_q, current_year_q, current_year, last_year, year_3ago } = data;
        let { months_last } = data;
        allStocks = stocks;

        // 載入預估資料
        stocks.forEach(s => {
            s._price = s.close || null;
            s._change = s.change || null;
            const est = _allEstimates[s.code] || {};
            s._est_gm = est._gm ?? null;
            s._est_gp = est._gp ?? null;
            s._est_opex = est._opex ?? null;
            s._est_nonop = est._nonop ?? null;
            s._est_eps = est._eps ?? null;
            s._est_div = est._div ?? null;
            s._est_q1eps = est._q1eps ?? null;
            s._est_aftertax = est._aftertax ?? null;
            s._est_pretax = (s._est_gp != null && s._est_opex != null) ? s._est_gp - s._est_opex + (s._est_nonop || 0) : null;
            s._est_pe = (s._est_eps > 0 && s._price) ? Math.round(s._price / s._est_eps * 100) / 100 : null;
            s._est_yld = (s._est_div > 0 && s._price > 0) ? Math.round(s._est_div / s._price * 10000) / 100 : null;
        });

        _renderParams = { months, months_last, quarterly_cols, last_year_q, current_year_q, currentYear: current_year, lastYear: last_year, year_3ago };

        const lastYrRoc = last_year - 1911;
        const curYrRoc = current_year - 1911;
        const sh = document.getElementById('sub-header');

        // 表頭
        let h = '';
        // 凍結欄
        h += `<th class="frozen-1 sortable" style="text-align:left" onclick="sortTable('code')">代碼 <span class="sort-arrow" id="sa_code">&#8597;</span></th>`;
        h += `<th class="frozen-2 sortable" style="text-align:left" onclick="sortTable('name')">名稱 <span class="sort-arrow" id="sa_name">&#8597;</span></th>`;
        h += `<th class="sortable" style="text-align:left" onclick="sortTable('industry')">產業別 <span class="sort-arrow" id="sa_industry">&#8597;</span></th>`;

        // 清單欄位
        h += `<th class="sep-left" style="font-size:11px">觀</th>`;
        h += `<th style="font-size:11px">持</th>`;
        h += `<th style="font-size:11px">重</th>`;
        h += `<th style="font-size:11px">略</th>`;

        // 去年月營收
        if (months_last && months_last.length > 0) {
            months_last.forEach((m, i) => {
                h += `<th class="g-lastrev sortable ${i === 0 ? 'sep-left' : ''}" onclick="sortTable('ml_${m}')">${lastYrRoc}年${monthNames[m-1]} <span class="sort-arrow" id="sa_ml_${m}">&#8597;</span></th>`;
            });
        }

        // 今年月營收
        if (months.length > 0) {
            months.forEach((m, i) => {
                h += `<th class="g-rev sortable ${i === 0 ? 'sep-left' : ''}" onclick="sortTable('monthly_${m}')">${curYrRoc}年${monthNames[m-1]} <span class="sort-arrow" id="sa_monthly_${m}">&#8597;</span></th>`;
            });
        }

        // 月變動
        h += `<th class="g-rev sortable sep-left" onclick="sortTable('mom_change')">月變動 <span class="sort-arrow" id="sa_mom_change">&#8597;</span></th>`;

        // 季毛利率
        quarterly_cols.forEach((q, i) => {
            const qRoc = q.replace(/^(\d{4})/, (m, y) => parseInt(y) - 1911);
            h += `<th class="g-gm sortable ${i === 0 ? 'sep-left' : ''}" onclick="sortTable('qgm_${q}')">${qRoc}毛利率 <span class="sort-arrow" id="sa_qgm_${q}">&#8597;</span></th>`;
        });

        // 季營收
        quarterly_cols.forEach((q, i) => {
            const isFirst = (i === 0);
            const isYearSep = (i === last_year_q.length && current_year_q.length > 0);
            h += `<th class="g-qrev sortable ${isFirst ? 'sep-left' : (isYearSep ? 'year-sep' : '')}" onclick="sortTable('qrev_${q}')">營${q.replace(/^(\d{4})/, (m, y) => parseInt(y) - 1911)} <span class="sort-arrow" id="sa_qrev_${q}">&#8597;</span></th>`;
        });

        // 季變動
        h += `<th class="g-qoq sortable sep-left" onclick="sortTable('qoq_change')">季變動 <span class="sort-arrow" id="sa_qoq_change">&#8597;</span></th>`;

    function renderRows(stocks, months, qCols, lastYearQ, currentYearQ, monthsLast, year3ago, currentYear, lastYear) {
        const tbody = document.getElementById('tbody');
        const fragment = document.createDocumentFragment();

        stocks.forEach(s => {
            const tr = document.createElement('tr');
            let r = '';

            // 代碼 + 名稱（凍結）
            r += `<td class="frozen-1"><a href="/company?code=${s.code}" target="_blank" style="color:inherit;text-decoration:none">${s.code}</a></td>`;
            r += `<td class="frozen-2">${s.name}</td>`;
            r += `<td style="text-align:left;color:#64748b">${s.industry || '-'}</td>`;

            // 清單 checkbox
            r += `<td class="sep-left" style="text-align:center"><input type="checkbox" class="list-cb" ${_lists.watch.has(s.code)?'checked':''} onchange="toggleListItem('watch','${s.code}')"></td>`;
            r += `<td style="text-align:center"><input type="checkbox" class="list-cb" ${_lists.hold.has(s.code)?'checked':''} onchange="toggleListItem('hold','${s.code}')"></td>`;
            r += `<td style="text-align:center"><input type="checkbox" class="list-cb" ${_lists.focus.has(s.code)?'checked':''} onchange="toggleListItem('focus','${s.code}')"></td>`;
            r += `<td style="text-align:center"><input type="checkbox" class="list-cb" ${_lists.skip.has(s.code)?'checked':''} onchange="toggleListItem('skip','${s.code}')"></td>`;

            // 去年月營收
            if (monthsLast && monthsLast.length > 0) {
                monthsLast.forEach((m, i) => {
                    const val = s.monthly_last ? s.monthly_last[m.toString()] : null;
                    r += `<td class="num g-lastrev ${i === 0 ? 'sep-left' : ''}">${val != null ? fmtRevM(val) : '-'}</td>`;
                });
            }

            // 今年月營收
            if (months.length > 0) {
                months.forEach((m, i) => {
                    const val = s.monthly[m.toString()];
                    r += `<td class="num g-rev ${i === 0 ? 'sep-left' : ''}">${val != null ? fmtRevM(val) : '-'}</td>`;
                });
            }

            // 月變動
            const chgCls = s.mom_change > 0 ? 'positive' : (s.mom_change < 0 ? 'negative' : '');
            r += `<td class="num g-rev sep-left ${chgCls}">${fmtChange(s.mom_change)}</td>`;

            // 季毛利率
            qCols.forEach((q, i) => {
                const val = s.quarterly_gm ? s.quarterly_gm[q] : null;
                r += `<td class="num g-gm ${i === 0 ? 'sep-left' : ''}">${val != null ? val.toFixed(1) + '%' : '-'}</td>`;
            });

            // 季營收
            qCols.forEach((q, i) => {
                const isFirst = (i === 0);
                const isYearSep = (i === lastYearQ.length && currentYearQ.length > 0);
                const cls = isFirst ? 'sep-left' : (isYearSep ? 'year-sep' : '');
                const val = s.quarterly_revenue[q];
                r += `<td class="num g-qrev ${cls}">${val != null ? fmtQRevM(val) : '-'}</td>`;
            });

            // 季變動
            const qoqCls = s.qoq_change > 0 ? 'positive' : (s.qoq_change < 0 ? 'negative' : '');
            r += `<td class="num g-qoq sep-left ${qoqCls}">${fmtChange(s.qoq_change)}</td>`;

            // 歷史年度 EPS
            if (year3ago && lastYear) {
                for (let yr = year3ago; yr < lastYear; yr++) {
                    const val = s.annual_eps ? s.annual_eps[yr.toString()] : null;
                    const cls2 = val != null && val < 0 ? 'negative' : '';
                    r += `<td class="num g-histeps ${yr === year3ago ? 'sep-left' : ''} ${cls2}">${val != null ? val.toFixed(2) : '-'}</td>`;
                }
            }

            // EPS 更新日
            const epsDate = s.eps_date || '-';
            const isEpsNew = epsDate === _today;
            const edStyle = isEpsNew ? 'color:#ef5350;font-weight:700' : 'color:#64748b';
            const epsQ = s.eps_latest_q ? `<br><span style="font-size:10px;color:#5a6a7a">${s.eps_latest_q}</span>` : '';
            r += `<td class="num g-qeps sep-left" style="font-size:inherit;${edStyle}">${epsDate}${epsQ}</td>`;

            // 季 EPS
            qCols.forEach((q, i) => {
                const isYearSep = (i === lastYearQ.length && currentYearQ.length > 0);
                const cls = isYearSep ? 'year-sep' : '';
                const val = s.quarterly_eps[q];
                const epsCls = val != null && val < 0 ? 'negative' : '';
                r += `<td class="num g-qeps ${cls} ${epsCls}">${val != null ? fmtEps(val) : '-'}</td>`;
            });

            // 年度 EPS 合計
            const aet = s.annual_eps_total;
            const aetCls = aet != null && aet < 0 ? 'negative' : '';
            r += `<td class="num g-qeps sep-left ${aetCls}" style="font-weight:600">${aet != null ? aet.toFixed(2) : '-'}</td>`;

            // 股價
            const p = s._price, chg2 = s._change;
            r += `<td class="num g-price sep-left price-val" data-code="${s.code}" data-field="price">${p != null ? p.toFixed(2) : '-'}</td>`;
            const chgCls2 = chg2 > 0 ? 'positive' : (chg2 < 0 ? 'negative' : '');
            r += `<td class="num g-price ${chgCls2}" data-code="${s.code}" data-field="change">${chg2 != null ? (chg2 > 0 ? '+' : '') + chg2.toFixed(2) : '-'}</td>`;

            // 股利
            const dc = s.div_cash, ds = s.div_stock;
            const dt = (dc != null || ds != null) ? ((dc || 0) + (ds || 0)) : null;
            r += `<td class="num g-div sep-left">${dc != null ? dc.toFixed(2) : '-'}</td>`;
            r += `<td class="num g-div">${ds != null ? ds.toFixed(2) : '-'}</td>`;
            r += `<td class="num g-div" style="font-weight:600">${dt != null ? dt.toFixed(2) : '-'}</td>`;

            // 沈董（從 DB 讀取）
            const se = s.shen_eps, spe = s.shen_pe, syld = s.shen_yld;
            const seCls = se != null && se < 0 ? 'negative' : '';
            r += `<td class="num g-shen sep-left ${seCls}">${se != null ? se.toFixed(2) : '-'}</td>`;
            r += `<td class="num g-shen">${spe != null ? spe.toFixed(2) : '-'}</td>`;
            r += `<td class="num g-shen">${syld != null ? syld.toFixed(2) + '%' : '-'}</td>`;

            // 預估明細
            const egm = s._est_gm, egp = s._est_gp, eop = s._est_opex, eno = s._est_nonop;
            const eptx = s._est_pretax, eatx = s._est_aftertax, eq1 = s._est_q1eps;
            const eeps = s._est_eps, epe = s._est_pe, ediv = s._est_div, eyld = s._est_yld;
            const hasEst = egm != null || egp != null || eop != null || eno != null || eeps != null || ediv != null;
            const estBg = hasEst ? 'background:#eff6ff' : '';
            r += `<td class="num g-est sep-left" style="${estBg}">${egm != null ? egm.toFixed(1) + '%' : '-'}</td>`;
            r += `<td class="num g-est" style="${estBg}">${egp != null ? egp.toLocaleString('zh-TW') : '-'}</td>`;
            r += `<td class="num g-est" style="${estBg}">${eop != null ? eop.toLocaleString('zh-TW') : '-'}</td>`;
            r += `<td class="num g-est" style="${estBg}">${eno != null ? eno.toLocaleString('zh-TW') : '-'}</td>`;
            r += `<td class="num g-est" style="${estBg}">${eptx != null ? eptx.toLocaleString('zh-TW') : '-'}</td>`;
            r += `<td class="num g-est" style="${estBg}">${eatx != null ? eatx.toLocaleString('zh-TW') : '-'}</td>`;
            r += `<td class="num g-est" style="${estBg}">${eq1 != null ? eq1.toFixed(2) : '-'}</td>`;
            r += `<td class="num g-est" style="${estBg};font-weight:${eeps != null ? '700' : '400'}">${eeps != null ? eeps.toFixed(2) : '-'}</td>`;
            r += `<td class="num g-est" style="${estBg}">${epe != null ? epe.toFixed(2) : '-'}</td>`;
            r += `<td class="num g-est" style="${estBg}">${ediv != null ? ediv.toFixed(2) : '-'}</td>`;
            r += `<td class="num g-est" style="${estBg}">${eyld != null ? eyld.toFixed(2) + '%' : '-'}</td>`;

            // 營收備註
            r += `<td class="g-note sep-left" style="font-size:.78rem;color:#64748b;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${s.revenue_note || ''}">${s.revenue_note || ''}</td>`;

            tr.innerHTML = r;
            fragment.appendChild(tr);
        });

        tbody.innerHTML = '';
        tbody.appendChild(fragment);
    }

    // ── 排序 ──
    function _getSortVal(s, key) {
        if (key === 'code') return s.code;
        if (key === 'name') return s.name;
        if (key === 'industry') return s.industry || '';
        if (key === 'mom_change') return s.mom_change;
        if (key === 'eps_date') return s.eps_date || '';
        if (key === '_price') return s._price;
        if (key === '_change') return s._change;
        if (key === 'div_cash') return s.div_cash;
        if (key === 'div_stock') return s.div_stock;
        if (key === 'div_total') { const c = s.div_cash, st = s.div_stock; return (c != null || st != null) ? (c||0)+(st||0) : null; }
        if (key === 'shen_eps') return s.shen_eps;
        if (key === 'shen_pe') return s.shen_pe;
        if (key === 'shen_yld') return s.shen_yld;
        if (key === 'qoq_change') return s.qoq_change;
        if (key === 'annual_eps_total') return s.annual_eps_total;
        if (key === 'est_gm') return s._est_gm;
        if (key === 'est_gp') return s._est_gp;
        if (key === 'est_opex') return s._est_opex;
        if (key === 'est_nonop') return s._est_nonop;
        if (key === 'est_pretax') return s._est_pretax;
        if (key === 'est_aftertax') return s._est_aftertax;
        if (key === 'est_q1eps') return s._est_q1eps;
        if (key === 'est_eps') return s._est_eps;
        if (key === 'est_pe') return s._est_pe;
        if (key === 'est_div') return s._est_div;
        if (key === 'est_yld') return s._est_yld;
        if (key.startsWith('ml_')) { const m = key.replace('ml_', ''); return s.monthly_last ? s.monthly_last[m] : null; }
        if (key.startsWith('monthly_')) { const m = key.replace('monthly_', ''); return s.monthly[m]; }
        if (key.startsWith('qgm_')) { const q = key.replace('qgm_', ''); return s.quarterly_gm ? s.quarterly_gm[q] : null; }
        if (key.startsWith('qrev_')) { const q = key.replace('qrev_', ''); return s.quarterly_revenue[q]; }
        if (key.startsWith('qeps_')) { const q = key.replace('qeps_', ''); return s.quarterly_eps[q]; }
        if (key.startsWith('aeps_')) { const yr = key.replace('aeps_', ''); return s.annual_eps ? s.annual_eps[yr] : null; }
        return null;
    }

    function sortTable(key) {
        if (_sortKey === key) _sortAsc = !_sortAsc;
        else { _sortKey = key; _sortAsc = (key === 'code' || key === 'name'); }

        document.querySelectorAll('.sort-arrow').forEach(el => { el.innerHTML = '&#8597;'; el.className = 'sort-arrow'; });
        const arrow = document.getElementById('sa_' + key);
        if (arrow) { arrow.textContent = _sortAsc ? '\u25B2' : '\u25BC'; arrow.className = 'sort-arrow ' + (_sortAsc ? 'asc' : 'desc'); }

        const isStr = (key === 'code' || key === 'name' || key === 'industry' || key === 'eps_date');
        allStocks.sort((a, b) => {
            let va = _getSortVal(a, key), vb = _getSortVal(b, key);
            if (va == null && vb == null) return 0;
            if (va == null) return 1;
            if (vb == null) return -1;
            if (isStr) return _sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
            return _sortAsc ? va - vb : vb - va;
        });

        applyFilter();
    }

    // ── 縮放 ──
    function applyZoom(val) {
        const pct = parseInt(val);
        document.getElementById('zoomVal').textContent = pct + '%';
        document.getElementById('main-table').style.fontSize = (pct / 100 * 14) + 'px';
        localStorage.setItem('sd_zoom', pct);
    }

    // ── 即時報價 ──
    async function fetchRealtimePrices() {
        const now = new Date();
        const h = now.getHours();
        const isWeekday = now.getDay() >= 1 && now.getDay() <= 5;
        if (!(h >= 9 && h < 16) || !isWeekday) return;

        const codes = allStocks.map(s => s.code);
        if (!codes.length) return;

        for (let i = 0; i < codes.length; i += 50) {
            const batch = codes.slice(i, i + 50);
            try {
                const res = await fetch('/api/realtime?codes=' + batch.join(','));
                const rtData = await res.json();
                for (const rt of rtData) {
                    if (rt.price == null) continue;
                    const stock = allStocks.find(s => s.code === rt.code);
                    if (stock) {
                        stock._price = rt.price;
                        stock._change = rt.yesterday ? Math.round((rt.price - rt.yesterday) * 100) / 100 : null;
                    }
                }
            } catch(e) { break; }
        }

        // 更新畫面上的股價欄位
        allStocks.forEach(s => {
            const pCell = document.querySelector(`td[data-code="${s.code}"][data-field="price"]`);
            const cCell = document.querySelector(`td[data-code="${s.code}"][data-field="change"]`);
            if (pCell && s._price != null) pCell.textContent = s._price.toFixed(2);
            if (cCell && s._change != null) {
                cCell.textContent = (s._change > 0 ? '+' : '') + s._change.toFixed(2);
                cCell.className = 'num g-price ' + (s._change > 0 ? 'positive' : s._change < 0 ? 'negative' : '');
            }
        });

        const si = document.getElementById('stats');
        if (si && !si.querySelector('.rt-badge')) {
            si.innerHTML += '<span class="rt-badge">即時報價</span>';
        }
    }

    // ── CSV 匯出 ──
    function exportCSV() {
        const { months, months_last, quarterly_cols, year_3ago, currentYear } = _renderParams;
        const lastYear = currentYear - 1;
        const headers = ['代碼','名稱','產業別'];
        if (months_last) months_last.forEach(m => headers.push((currentYear-1-1911)+'年'+monthNames[m-1]+'營收'));
        months.forEach(m => headers.push((currentYear-1911)+'年'+monthNames[m-1]+'營收'));
        headers.push('月變動%');
        quarterly_cols.forEach(q => headers.push('毛利率'+q));
        quarterly_cols.forEach(q => headers.push('營'+q));
        headers.push('季變動%');
        if (year_3ago) for (let yr = year_3ago; yr < lastYear; yr++) headers.push((yr-1911)+'年EPS');
        headers.push('EPS更新');
        quarterly_cols.forEach(q => headers.push('EPS'+q));
        headers.push((lastYear-1911)+'年EPS合計');
        headers.push('股價','漲跌','現金股利','股票股利','股利合計','沈董EPS','沈董PE','殖利率%');
        headers.push('估毛利率','估毛利','估費用','估業外','估稅前','估稅後','預估Q1 EPS','估EPS','預估本益比','估配息','估殖利率');
        headers.push('營收備註');

        const rows = [headers.join(',')];
        const esc = v => {
            if (v == null) return '';
            const s = String(v);
            return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g,'""') + '"' : s;
        };

        filteredStocks.forEach(s => {
            const cols = [s.code, s.name, s.industry || ''];
            if (months_last) months_last.forEach(m => cols.push(s.monthly_last && s.monthly_last[m.toString()] != null ? Math.round(s.monthly_last[m.toString()] / 1000) : ''));
            months.forEach(m => cols.push(s.monthly[m.toString()] != null ? Math.round(s.monthly[m.toString()] / 1000) : ''));
            cols.push(s.mom_change != null ? s.mom_change : '');
            quarterly_cols.forEach(q => cols.push(s.quarterly_gm && s.quarterly_gm[q] != null ? s.quarterly_gm[q] : ''));
            quarterly_cols.forEach(q => cols.push(s.quarterly_revenue[q] != null ? Math.round(s.quarterly_revenue[q] / 1000000) : ''));
            cols.push(s.qoq_change != null ? s.qoq_change : '');
            if (year_3ago) for (let yr = year_3ago; yr < lastYear; yr++) cols.push(s.annual_eps && s.annual_eps[yr.toString()] != null ? s.annual_eps[yr.toString()] : '');
            cols.push(s.eps_date || '');
            quarterly_cols.forEach(q => cols.push(s.quarterly_eps[q] != null ? s.quarterly_eps[q] : ''));
            cols.push(s.annual_eps_total != null ? s.annual_eps_total : '');
            cols.push(s._price != null ? s._price : '', s._change != null ? s._change : '');
            const dc = s.div_cash, ds = s.div_stock, dt = (dc != null || ds != null) ? (dc||0)+(ds||0) : '';
            cols.push(dc != null ? dc : '', ds != null ? ds : '', dt);
            cols.push(s.shen_eps != null ? s.shen_eps : '', s.shen_pe != null ? s.shen_pe : '', s.shen_yld != null ? s.shen_yld : '');
            cols.push(s._est_gm != null ? s._est_gm : '', s._est_gp != null ? s._est_gp : '', s._est_opex != null ? s._est_opex : '', s._est_nonop != null ? s._est_nonop : '');
            cols.push(s._est_pretax != null ? s._est_pretax : '', s._est_aftertax != null ? s._est_aftertax : '', s._est_q1eps != null ? s._est_q1eps : '', s._est_eps != null ? s._est_eps : '');
            cols.push(s._est_pe != null ? s._est_pe : '', s._est_div != null ? s._est_div : '', s._est_yld != null ? s._est_yld : '');
            cols.push(s.revenue_note || '');
            rows.push(cols.map(esc).join(','));
        });

        const bom = '\uFEFF';
        const blob = new Blob([bom + rows.join('\n')], {type:'text/csv;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `沈董投資系統_${_today}.csv`;
        a.click(); URL.revokeObjectURL(url);
    }

    // 啟動
    init();
    </script>
</body>
</html>
