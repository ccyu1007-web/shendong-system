<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈董投資系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f8;
            color: #1a202c;
            font-size: 14px;
        }

        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,.25);
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stats {
            color: rgba(255,255,255,.8);
            font-size: 12px;
        }

        .btn {
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,.4);
            background: rgba(255,255,255,.15);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,.25); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 搜尋 */
        .toolbar {
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
        }

        .search-input {
            padding: 5px 10px;
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #1a202c;
            border-radius: 6px;
            font-size: 13px;
            width: 200px;
            outline: none;
        }
        .search-input:focus { border-color: #2563eb; }
        .search-input::placeholder { color: #94a3b8; }

        .filter-info {
            color: #64748b;
            font-size: 12px;
        }

        /* 表格 */
        .table-wrapper {
            overflow: auto;
            height: calc(100vh - 110px);
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            background: #fff;
        }

        /* 表頭 */
        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #1e3a5f;
            color: #fff;
            padding: 6px 10px;
            text-align: center;
            font-weight: 600;
            white-space: nowrap;
        }

        thead tr.sub-header th {
            background: #1e3a5f;
            color: #fff;
            font-weight: 600;
            padding: 6px 10px;
            border-bottom: 2px solid #2563eb;
            top: 0;
        }

        /* 保留供未來使用 */

        /* 表身 */
        tbody tr {
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.1s;
        }
        tbody tr:hover { background: #f8fafc; }
        tbody tr:nth-child(even) { background: #f8fafc; }
        tbody tr:nth-child(even):hover { background: #f1f5f9; }

        tbody td {
            padding: 5px 10px;
            text-align: right;
            white-space: nowrap;
            border-bottom: 1px solid #f1f5f9;
        }

        td.stock-code {
            text-align: left;
            font-weight: 700;
            color: #2563eb;
            position: sticky;
            left: 0;
            background: inherit;
            z-index: 5;
        }
        tbody tr:nth-child(odd) td.stock-code { background: #fff; }
        tbody tr:nth-child(even) td.stock-code { background: #f8fafc; }
        tbody tr:hover td.stock-code { background: #f1f5f9; }

        td.stock-name {
            text-align: left;
            color: #334155;
            position: sticky;
            left: 55px;
            background: inherit;
            z-index: 5;
        }
        tbody tr:nth-child(odd) td.stock-name { background: #fff; }
        tbody tr:nth-child(even) td.stock-name { background: #f8fafc; }
        tbody tr:hover td.stock-name { background: #f1f5f9; }

        th.sticky-code {
            position: sticky;
            left: 0;
            z-index: 20;
            background: #1e3a5f !important;
        }
        th.sticky-name {
            position: sticky;
            left: 55px;
            z-index: 20;
            background: #1e3a5f !important;
        }

        td.num {
            font-variant-numeric: tabular-nums;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
        }

        td.positive { color: #dc2626; }
        td.negative { color: #16a34a; }

        td.price-val { font-weight: 700; color: #1e3a5f; }
        .rt-badge { display:inline-block; padding:1px 6px; border-radius:3px; background:#059669; color:#fff; font-size:10px; margin-left:6px; }

        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { color: #fbbf24; }
        .sort-arrow { font-size: 10px; color: rgba(255,255,255,.5); }
        .sort-arrow.asc { color: #fbbf24; }
        .sort-arrow.desc { color: #fbbf24; }

        .sep-left { border-left: 2px solid #e2e8f0; }
        .year-sep { border-left: 2px dashed #cbd5e1; }

        td.na { color: #94a3b8; text-align: center; }

        .loading {
            text-align: center;
            padding: 80px;
            color: #94a3b8;
            font-size: 16px;
        }

        /* 營收單位提示 */
        .unit-hint { font-size: 10px; color: rgba(255,255,255,.6); font-weight: 400; }

        .inst-pos { color: #dc2626; font-weight: 600; }
        .inst-neg { color: #16a34a; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>沈董投資系統</h1>
        </div>
        <div class="header-right">
            <span class="stats" id="stats"></span>
            <label style="font-size:12px;color:#64748b;display:flex;align-items:center;gap:4px;white-space:nowrap">縮放
                <input type="range" id="zoomSlider" min="50" max="150" value="100" step="5" style="width:70px;cursor:pointer" oninput="applyZoom(this.value)">
                <span id="zoomVal" style="min-width:30px;color:rgba(255,255,255,.9)">100%</span>
            </label>
            <button class="btn" id="btn-quick" onclick="updateQuick()">快速更新</button>
        </div>
    </div>

    <div class="toolbar">
        <input type="text" class="search-input" id="search" placeholder="搜尋代碼或名稱..." oninput="filterTable()">
        <span style="font-size:13px;font-weight:700;color:#64748b">觀察</span>
        <button id="btnWatchFilter" onclick="toggleWatchFilter()" style="padding:4px 14px;border:2px solid #7c3aed;background:#fff;color:#7c3aed;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700">顯示 <span id="watchCount"></span></button>
        <button onclick="openWatchPanel()" style="padding:4px 14px;border:2px solid #7c3aed;background:#fff;color:#7c3aed;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700">編輯</button>
        <span class="filter-info" id="filter-info"></span>
    </div>

    <div class="table-wrapper">
        <div class="loading" id="loading">載入中...</div>
        <table id="main-table" style="display:none;">
            <thead>
                <tr class="sub-header" id="sub-header"></tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script>
        let allStocks = [];
        const _today = new Date().toISOString().slice(0, 10);

        // ── 觀察名單 ──
        let _watchSet = new Set();
        let _watchOnly = false;
        let _allEstimates = {};

        async function loadUserData() {
            try {
                const [wRes, eRes] = await Promise.all([fetch('/api/watchlist'), fetch('/api/estimates')]);
                const wList = await wRes.json();
                _watchSet = new Set(wList);
                _allEstimates = await eRes.json();
                updateWatchCount();
            } catch(e) {}
        }

        function toggleWatchFilter() {
            _watchOnly = !_watchOnly;
            const btn = document.getElementById('btnWatchFilter');
            btn.style.background = _watchOnly ? '#2563eb' : '';
            btn.style.color = _watchOnly ? '#fff' : '';
            filterTable();
        }
        function updateWatchCount() {
            const el = document.getElementById('watchCount');
            if (el) el.textContent = _watchSet.size ? `${_watchSet.size} 支` : '';
        }
        function saveWatch() {
            fetch('/api/watchlist', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({codes: [..._watchSet]}) });
            updateWatchCount();
        }
        function openWatchPanel() {
            let panel = document.getElementById('watchPanel');
            if (panel) { panel.style.display = panel.style.display === 'none' ? 'block' : 'none'; return; }
            panel = document.createElement('div');
            panel.id = 'watchPanel';
            panel.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.2);padding:24px;z-index:9999;min-width:360px;max-height:80vh;overflow-y:auto';
            renderWatchPanel(panel);
            document.body.appendChild(panel);
        }
        function renderWatchPanel(panel) {
            if (!panel) panel = document.getElementById('watchPanel');
            if (!panel) return;
            const items = [..._watchSet].map(code => {
                const stock = allStocks.find(s => s.code === code);
                const name = stock ? stock.name : '';
                return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9">
                  <span><strong style="color:#2563eb">${code}</strong> ${name}</span>
                  <button onclick="removeWatch('${code}')" style="border:none;background:none;color:#ef4444;cursor:pointer;font-weight:700;font-size:1rem">x</button>
                </div>`;
            }).join('');
            panel.innerHTML = `
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <span style="font-weight:700;font-size:1rem">觀察名單</span>
                <button onclick="document.getElementById('watchPanel').style.display='none'" style="border:none;background:none;cursor:pointer;font-size:1.2rem;color:#64748b">x</button>
              </div>
              <div style="display:flex;gap:8px;margin-bottom:16px">
                <input id="watchInput" placeholder="輸入股票代碼" style="flex:1;border:1px solid #cbd5e1;border-radius:6px;padding:6px 10px;font-size:.9rem" onkeydown="if(event.key==='Enter')addWatch()">
                <button onclick="addWatch()" style="padding:6px 14px;border:1px solid #2563eb;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:.85rem;font-weight:600">加入</button>
              </div>
              <div id="watchListItems">${items || '<span style="color:#94a3b8">尚未加入觀察名單</span>'}</div>
            `;
        }
        function addWatch() {
            const input = document.getElementById('watchInput');
            const code = input.value.trim();
            if (!code) return;
            _watchSet.add(code);
            saveWatch();
            input.value = '';
            renderWatchPanel();
            if (_watchOnly) filterTable();
        }
        function removeWatch(code) {
            _watchSet.delete(code);
            saveWatch();
            renderWatchPanel();
            if (_watchOnly) filterTable();
        }

        // 營收格式化：千元 → 顯示百萬（除以1000）
        function fmtRevM(val) {
            if (val == null) return '-';
            return Math.round(val / 1000).toLocaleString('zh-TW');
        }

        // 季營收格式化：元 → 顯示百萬（除以1,000,000）
        function fmtQRevM(val) {
            if (val == null) return '-';
            return Math.round(val / 1000000).toLocaleString('zh-TW');
        }

        function fmtEps(val) {
            if (val == null) return '-';
            return val.toFixed(2);
        }

        function fmtChange(val) {
            if (val == null) return '-';
            return (val > 0 ? '+' : '') + val.toFixed(2) + '%';
        }

        const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

        async function loadData() {
            try {
                const [stockResp, statResp] = await Promise.all([
                    fetch('/api/stocks'),
                    fetch('/api/stats'),
                ]);
                const data = await stockResp.json();
                const stats = await statResp.json();

                document.getElementById('stats').textContent =
                    `${stats.stocks} 支 | 月營收 ${stats.monthly_revenue_records} 筆 | 季報 ${stats.quarterly_records} 筆` +
                    (stats.latest_month ? ` | 最新月份 ${stats.latest_month}` : '');

                await loadUserData();
                renderTable(data);
            } catch (e) {
                document.getElementById('loading').textContent = '載入失敗：' + e.message;
            }
        }

        function renderTable(data) {
            const { stocks, months, quarterly_cols, last_year_q, current_year_q, current_year, last_year } = data;
            allStocks = stocks;
            // 初始化股價欄位（用逍遙系統收盤價作預設）
            stocks.forEach(s => {
                s._price = s.close || null;
                s._change = s.change || null;
                // 載入自行估算（從 DB）
                const est = _allEstimates[s.code] || {};
                s._est_gm = est._gm ?? null;
                s._est_gp = est._gp ?? null;
                s._est_opex = est._opex ?? null;
                s._est_nonop = est._nonop ?? null;
                s._est_eps = est._eps ?? null;
            });

            const sh = document.getElementById('sub-header');

            // 保存渲染參數供排序後重繪用
            _renderParams = { months, quarterly_cols, last_year_q, current_year_q, current_year, last_year };

            // 單列表頭
            let shHtml = `<th class="sticky-code sortable" style="text-align:left;background:#1e3a5f" onclick="sortTable('code')">代碼 <span class="sort-arrow" id="sa_code">↕</span></th>` +
                         `<th class="sticky-name sortable" style="text-align:left;background:#1e3a5f" onclick="sortTable('name')">名稱 <span class="sort-arrow" id="sa_name">↕</span></th>` +
                         `<th class="sortable" style="text-align:left" onclick="sortTable('industry')">產業別 <span class="sort-arrow" id="sa_industry">↕</span></th>`;

            // 月營收
            if (months.length > 0) {
                months.forEach((m, i) => {
                    shHtml += `<th class="sortable ${i === 0 ? 'sep-left' : ''}" onclick="sortTable('monthly_${m}')">${monthNames[m-1]} <span class="sort-arrow" id="sa_monthly_${m}">↕</span></th>`;
                });
            }

            // 月變動
            shHtml += `<th class="sortable sep-left" onclick="sortTable('mom_change')">月變動 <span class="sort-arrow" id="sa_mom_change">↕</span></th>`;

            // 季營收
            if (quarterly_cols.length > 0) {
                quarterly_cols.forEach((q, i) => {
                    const isFirst = (i === 0);
                    const isYearSep = (i === last_year_q.length && current_year_q.length > 0);
                    shHtml += `<th class="sortable ${isFirst ? 'sep-left' : (isYearSep ? 'year-sep' : '')}" onclick="sortTable('qrev_${q}')">營${q} <span class="sort-arrow" id="sa_qrev_${q}">↕</span></th>`;
                });
            }

            // 季EPS(累計)
            if (quarterly_cols.length > 0) {
                shHtml += `<th class="sortable sep-left" onclick="sortTable('eps_date')">EPS更新 <span class="sort-arrow" id="sa_eps_date">↕</span></th>`;
                quarterly_cols.forEach((q, i) => {
                    const isYearSep = (i === last_year_q.length && current_year_q.length > 0);
                    shHtml += `<th class="sortable ${isYearSep ? 'year-sep' : ''}" onclick="sortTable('qeps_${q}')">EPS${q} <span class="sort-arrow" id="sa_qeps_${q}">↕</span></th>`;
                });
            }

            // 即時股價
            shHtml += `<th class="sortable sep-left" onclick="sortTable('_price')">股價 <span class="sort-arrow" id="sa__price">↕</span></th>`;
            shHtml += `<th class="sortable" onclick="sortTable('_change')">漲跌 <span class="sort-arrow" id="sa__change">↕</span></th>`;

            // 股利
            const divLabel = stocks.length > 0 ? (stocks.find(s => s.div_label) || {}).div_label : '';
            const divYr = divLabel ? divLabel + '年' : '';
            shHtml += `<th class="sortable sep-left" onclick="sortTable('div_cash')">現金股利 <span class="sort-arrow" id="sa_div_cash">↕</span></th>`;
            shHtml += `<th class="sortable" onclick="sortTable('div_stock')">股票股利 <span class="sort-arrow" id="sa_div_stock">↕</span></th>`;
            shHtml += `<th class="sortable" onclick="sortTable('div_total')">股利合計 <span class="sort-arrow" id="sa_div_total">↕</span></th>`;

            // 沈董
            shHtml += `<th class="sortable sep-left" onclick="sortTable('shen_eps')">沈董EPS <span class="sort-arrow" id="sa_shen_eps">↕</span></th>`;
            shHtml += `<th class="sortable" onclick="sortTable('shen_pe')">沈董PE <span class="sort-arrow" id="sa_shen_pe">↕</span></th>`;
            shHtml += `<th class="sortable" onclick="sortTable('shen_yld')">殖利率 <span class="sort-arrow" id="sa_shen_yld">↕</span></th>`;

            // 自行估算
            shHtml += `<th class="sortable sep-left" onclick="sortTable('est_gm')">估毛利率 <span class="sort-arrow" id="sa_est_gm">↕</span></th>`;
            shHtml += `<th class="sortable" onclick="sortTable('est_gp')">估毛利 <span class="sort-arrow" id="sa_est_gp">↕</span></th>`;
            shHtml += `<th class="sortable" onclick="sortTable('est_opex')">估費用 <span class="sort-arrow" id="sa_est_opex">↕</span></th>`;
            shHtml += `<th class="sortable" onclick="sortTable('est_nonop')">估業外 <span class="sort-arrow" id="sa_est_nonop">↕</span></th>`;
            shHtml += `<th class="sortable" onclick="sortTable('est_eps')">估EPS <span class="sort-arrow" id="sa_est_eps">↕</span></th>`;

            // 營收備註
            shHtml += `<th class="sep-left">營收備註</th>`;

            sh.innerHTML = shHtml;

            // 表身
            renderRows(stocks, months, quarterly_cols, last_year_q, current_year_q);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-table').style.display = 'table';
            document.getElementById('filter-info').textContent = `共 ${stocks.length} 支`;
        }

        function renderRows(stocks, months, qCols, lastYearQ, currentYearQ) {
            const tbody = document.getElementById('tbody');
            // 用 DocumentFragment 提高渲染效能
            const fragment = document.createDocumentFragment();

            stocks.forEach(s => {
                const tr = document.createElement('tr');
                let html = '';

                // 股票
                html += `<td class="stock-code"><a href="/company?code=${s.code}" target="_blank" style="color:inherit;text-decoration:none">${s.code}</a></td>`;
                html += `<td class="stock-name">${s.name}</td>`;
                html += `<td style="text-align:left;font-size:inherit;color:#64748b;white-space:nowrap">${s.industry || '-'}</td>`;

                // 月營收
                if (months.length > 0) {
                    months.forEach((m, i) => {
                        const val = s.monthly[m.toString()];
                        html += `<td class="num ${i === 0 ? 'sep-left' : ''}">${val != null ? fmtRevM(val) : '-'}</td>`;
                    });
                }

                // 月變動
                const chgCls = s.mom_change > 0 ? 'positive' : (s.mom_change < 0 ? 'negative' : '');
                html += `<td class="num sep-left ${chgCls}">${fmtChange(s.mom_change)}</td>`;

                // 季營收
                qCols.forEach((q, i) => {
                    const isFirst = (i === 0);
                    const isYearSep = (i === lastYearQ.length && currentYearQ.length > 0);
                    const cls = isFirst ? 'sep-left' : (isYearSep ? 'year-sep' : '');
                    const val = s.quarterly_revenue[q];
                    html += `<td class="num ${cls}">${val != null ? fmtQRevM(val) : '-'}</td>`;
                });

                // 季EPS — 更新日（僅最新季度今日首次出現才紅色）
                const epsDate = s.eps_date || '-';
                const isEpsNew = epsDate === _today;
                const edStyle = isEpsNew ? 'color:#ef5350;font-weight:700' : 'color:#64748b';
                const epsQ = s.eps_latest_q ? `<br><span style="font-size:10px;color:#5a6a7a">${s.eps_latest_q}</span>` : '';
                html += `<td class="num sep-left" style="font-size:inherit;${edStyle}">${epsDate}${epsQ}</td>`;

                // 季EPS
                qCols.forEach((q, i) => {
                    const isYearSep = (i === lastYearQ.length && currentYearQ.length > 0);
                    const cls = isYearSep ? 'year-sep' : '';
                    const val = s.quarterly_eps[q];
                    const epsCls = val != null && val < 0 ? 'negative' : '';
                    html += `<td class="num ${cls} ${epsCls}">${val != null ? fmtEps(val) : '-'}</td>`;
                });

                // 即時股價（季EPS右側）
                const p = s._price, chg = s._change;
                const pStr = p != null ? p.toFixed(2) : '-';
                const chgCls2 = chg > 0 ? 'positive' : (chg < 0 ? 'negative' : '');
                const chgStr2 = chg != null ? (chg > 0 ? '+' : '') + chg.toFixed(2) : '-';
                html += `<td class="num sep-left price-val" data-code="${s.code}" data-field="price">${pStr}</td>`;
                html += `<td class="num ${chgCls2}" data-code="${s.code}" data-field="change">${chgStr2}</td>`;

                // 股利
                const dc = s.div_cash, ds = s.div_stock;
                const dt = (dc != null || ds != null) ? ((dc || 0) + (ds || 0)) : null;
                html += `<td class="num sep-left">${dc != null ? dc.toFixed(2) : '-'}</td>`;
                html += `<td class="num">${ds != null ? ds.toFixed(2) : '-'}</td>`;
                html += `<td class="num" style="font-weight:600">${dt != null ? dt.toFixed(2) : '-'}</td>`;

                // 沈董EPS + 本益比 + 殖利率
                const se = s.shen_eps, sp = s.shen_pe;
                const seCls = se != null && se < 0 ? 'negative' : '';
                const sYld = (dt != null && dt > 0 && s._price != null && s._price > 0) ? (dt / s._price * 100) : null;
                html += `<td class="num sep-left ${seCls}">${se != null ? se.toFixed(2) : '-'}</td>`;
                html += `<td class="num">${sp != null ? sp.toFixed(2) : '-'}</td>`;
                html += `<td class="num">${sYld != null ? sYld.toFixed(2) + '%' : '-'}</td>`;

                // 自行估算
                const egm = s._est_gm, egp = s._est_gp, eop = s._est_opex, eno = s._est_nonop, eeps = s._est_eps;
                const hasEst = egm != null || egp != null || eop != null || eno != null || eeps != null;
                const estStyle = hasEst ? 'background:#eff6ff' : '';
                html += `<td class="num sep-left" style="${estStyle}">${egm != null ? egm.toFixed(1) + '%' : '-'}</td>`;
                html += `<td class="num" style="${estStyle}">${egp != null ? egp.toLocaleString('zh-TW') : '-'}</td>`;
                html += `<td class="num" style="${estStyle}">${eop != null ? eop.toLocaleString('zh-TW') : '-'}</td>`;
                html += `<td class="num" style="${estStyle}">${eno != null ? eno.toLocaleString('zh-TW') : '-'}</td>`;
                html += `<td class="num" style="${estStyle};font-weight:${eeps != null ? '700' : '400'}">${eeps != null ? eeps.toFixed(2) : '-'}</td>`;

                // 營收備註
                html += `<td class="sep-left" style="font-size:.78rem;color:#64748b;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${s.revenue_note || ''}">${s.revenue_note || ''}</td>`;

                tr.innerHTML = html;
                fragment.appendChild(tr);
            });

            tbody.innerHTML = '';
            tbody.appendChild(fragment);
        }

        // ── 排序 ──
        let _sortKey = null, _sortAsc = true;
        let _renderParams = {};

        function _getSortVal(s, key) {
            if (key === 'code') return s.code;
            if (key === 'name') return s.name;
            if (key === 'industry') return s.industry || '';
            if (key === 'mom_change') return s.mom_change;
            if (key === 'eps_date') return s.eps_date || '';
            if (key === '_price') return s._price;
            if (key === '_change') return s._change;
            if (key === 'div_cash') return s.div_cash;
            if (key === 'div_stock') return s.div_stock;
            if (key === 'div_total') { const c = s.div_cash, st = s.div_stock; return (c != null || st != null) ? (c||0)+(st||0) : null; }
            if (key === 'shen_eps') return s.shen_eps;
            if (key === 'shen_pe') return s.shen_pe;
            if (key === 'est_gm') return s._est_gm;
            if (key === 'est_gp') return s._est_gp;
            if (key === 'est_opex') return s._est_opex;
            if (key === 'est_nonop') return s._est_nonop;
            if (key === 'est_eps') return s._est_eps;
            if (key === 'shen_yld') { const c = s.div_cash, st = s.div_stock, p = s._price; const t = (c!=null||st!=null)?(c||0)+(st||0):null; return (t>0&&p>0)?t/p*100:null; }
            if (key.startsWith('monthly_')) { const m = key.replace('monthly_', ''); return s.monthly[m]; }
            if (key.startsWith('qrev_')) { const q = key.replace('qrev_', ''); return s.quarterly_revenue[q]; }
            if (key.startsWith('qeps_')) { const q = key.replace('qeps_', ''); return s.quarterly_eps[q]; }
            return null;
        }

        function sortTable(key) {
            if (_sortKey === key) _sortAsc = !_sortAsc;
            else { _sortKey = key; _sortAsc = (key === 'code' || key === 'name'); }

            // 更新箭頭
            document.querySelectorAll('.sort-arrow').forEach(el => { el.textContent = '↕'; el.className = 'sort-arrow'; });
            const arrow = document.getElementById('sa_' + key);
            if (arrow) { arrow.textContent = _sortAsc ? '▲' : '▼'; arrow.className = 'sort-arrow ' + (_sortAsc ? 'asc' : 'desc'); }

            const isStr = (key === 'code' || key === 'name' || key === 'industry' || key === 'eps_date');
            allStocks.sort((a, b) => {
                let va = _getSortVal(a, key), vb = _getSortVal(b, key);
                if (va == null && vb == null) return 0;
                if (va == null) return 1;
                if (vb == null) return -1;
                if (isStr) return _sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
                return _sortAsc ? va - vb : vb - va;
            });

            const { months, quarterly_cols, last_year_q, current_year_q } = _renderParams;
            renderRows(allStocks, months, quarterly_cols, last_year_q, current_year_q);
            filterTable();
        }

        // 搜尋篩選
        function filterTable() {
            const keyword = document.getElementById('search').value.trim().toLowerCase();
            const tbody = document.getElementById('tbody');
            const rows = tbody.querySelectorAll('tr');
            let visible = 0;

            rows.forEach((tr, i) => {
                const stock = allStocks[i];
                if (!stock) return;
                const matchKw = !keyword ||
                    stock.code.toLowerCase().includes(keyword) ||
                    stock.name.toLowerCase().includes(keyword);
                const matchWatch = !_watchOnly || _watchSet.has(stock.code);
                const show = matchKw && matchWatch;
                tr.style.display = show ? '' : 'none';
                if (show) visible++;
            });

            document.getElementById('filter-info').textContent =
                (_watchOnly ? '觀察名單：' : '') +
                (keyword ? `篩選：${visible} / ${allStocks.length} 支` : `共 ${visible} 支`);
        }

        // 快速更新
        async function updateQuick() {
            const btn = document.getElementById('btn-quick');
            btn.disabled = true;
            btn.textContent = '更新中...';
            try {
                await fetch('/api/update/quick', { method: 'POST' });
                location.reload();
            } catch (e) {
                alert('更新失敗：' + e.message);
                btn.disabled = false;
                btn.textContent = '快速更新';
            }
        }

        // ── 縮放 ──
        function applyZoom(val) {
            const pct = parseInt(val);
            document.getElementById('zoomVal').textContent = pct + '%';
            document.getElementById('main-table').style.fontSize = (pct / 100 * 14) + 'px';
            localStorage.setItem('shendong_zoom', pct);
        }
        (function() {
            const saved = localStorage.getItem('shendong_zoom');
            if (saved) {
                const slider = document.getElementById('zoomSlider');
                if (slider) { slider.value = saved; applyZoom(saved); }
            }
        })();

        // ── 即時報價 ──
        async function fetchRealtimePrices() {
            const now = new Date();
            const h = now.getHours();
            const isWeekday = now.getDay() >= 1 && now.getDay() <= 5;
            if (!(h >= 9 && h < 16) || !isWeekday) return;

            const codes = allStocks.map(s => s.code);
            if (!codes.length) return;

            for (let i = 0; i < codes.length; i += 50) {
                const batch = codes.slice(i, i + 50);
                try {
                    const res = await fetch('/api/realtime?codes=' + batch.join(','));
                    const rtData = await res.json();
                    for (const rt of rtData) {
                        if (rt.price == null) continue;
                        const stock = allStocks.find(s => s.code === rt.code);
                        if (stock) {
                            stock._price = rt.price;
                            stock._change = rt.yesterday ? Math.round((rt.price - rt.yesterday) * 100) / 100 : null;
                        }
                    }
                } catch(e) { break; }
            }

            // 更新畫面上的股價欄位（不重繪整個表格）
            allStocks.forEach(s => {
                const pCell = document.querySelector(`td[data-code="${s.code}"][data-field="price"]`);
                const cCell = document.querySelector(`td[data-code="${s.code}"][data-field="change"]`);
                if (pCell && s._price != null) pCell.textContent = s._price.toFixed(2);
                if (cCell && s._change != null) {
                    cCell.textContent = (s._change > 0 ? '+' : '') + s._change.toFixed(2);
                    cCell.className = 'num ' + (s._change > 0 ? 'positive' : s._change < 0 ? 'negative' : '');
                }
            });

            // 標記即時狀態
            const si = document.getElementById('stats');
            if (si && !si.querySelector('.rt-badge')) {
                si.innerHTML += '<span class="rt-badge">即時報價</span>';
            }
        }

        loadData().then(() => {
            fetchRealtimePrices();
            // 每 60 秒刷新一次
            setInterval(fetchRealtimePrices, 60000);
        });
    </script>
</body>
</html>
