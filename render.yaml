services:
  - type: web
    name: shendong-system
    runtime: python
    repo: https://github.com/ccyu1007-web/shendong-system
    branch: master
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
